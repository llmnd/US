services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mamari}
      POSTGRES_USER: ${POSTGRES_USER:-mamari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mamari}
    ports:
      - "5432:5432"
    volumes:
      - mamari-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mamari} -d ${POSTGRES_DB:-mamari}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mamari-postgres:
